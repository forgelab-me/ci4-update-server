; Release archives are the payload here, so the upload limits matter more than
; they would for a typical app. The application caps uploads at 256 MB too.
upload_max_filesize = 256M
post_max_size = 256M
memory_limit = 512M
max_execution_time = 300

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
